[package]
name = "daemon"
version.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true
documentation.workspace = true

[[bin]]
name = "permafrostd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
chrono = "0.4.44"
config.workspace = true
dirs = "7.0.0"
futures.workspace = true
jiff.workspace = true
log.workspace = true
memmap2 = "0.9.10"
rustix = { version = "1.1.4", features = ["fs"] }
sea-orm = { version = "2.0.3", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "schema-sync", "entity-registry"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
tokio-cron-scheduler = "0.15.1"
uuid = { version = "1.26.1", features = ["v4"] }
wayrs-client = { version = "1.3.1", features = ["tokio"] }
wayrs-protocols = { version = "0.14.11", features = ["wlr-gamma-control-unstable-v1"] }
zbus.workspace = true
zvariant.workspace = true
