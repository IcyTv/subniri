[workspace.package]
version = "0.0.1"
authors = ["IcyTv"]
description = "Desktop shell for niri"
edition = "2024"
documentation = "https://github.com/IcyTv/subniri-slint"

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
async-channel = "2.5.0"
async-stream = "0.3.6"
bluer = { version = "0.17.4", features = ["bluetoothd"] }
clap = { version = "4.6.1", features = ["derive"] }
config = { version = "0.0.1", path = "crates/config" }
daemon = { path = "./crates/daemon" }
float-ord = "0.3.2"
freedesktop-desktop-entry = "0.8.1"
futures = "0.3.32"
iced = { version = "0.15.0-dev", features = [
  "advanced",
  "crisp",
  "hinting",
  "image",
  "lazy",
  "linux-theme-detection",
  "svg",
  "sysinfo",
  "thread-pool",
  "wayland",
  "wgpu",
  "wgpu-bare",
  "tokio",
  "canvas",
], git = "https://github.com/IcyTv/iced", default-features = false, rev = "45e9c2cebd53363e93b6a2382f7dadb1d38c7f27" }
iced_runtime = { git = "https://github.com/IcyTv/iced", version = "0.15.0-dev", rev = "45e9c2cebd53363e93b6a2382f7dadb1d38c7f27" }
iced_layershell = { git = "https://github.com/IcyTv/exwlshelleventloop", version = "0.18.1", rev = "3b5118610c24090a4196c0f845d7b6bdb059fefe" }
icon = "0.2.0"
image = "0.25.10"
jiff = "0.2.25"
kdl = { version = "6.5.0", features = ["v1-fallback"] }
launcher-common = { path = "./crates/launcher-common" }
libpulse-binding = { version = "=2.26.0", features = ["pa_v15"] }
libpulse-tokio = "0.1.1"
log = "0.4.29"
lru = "0.18.0"
lyon_algorithms = "1.0.20"
mprizzle = { git = "https://github.com/IcyTv/mprizzle", version = "0.0.8" }
neo-widgets = { version = "0.0.1", path = "crates/neo-widgets" }
niri-ipc = "26.4.0"
nix = { version = "0.31.3", features = ["user"] }
nmrs = "3.1.5"
num-traits = "0.2.19"
pretty_env_logger = "0.5.0"
reqwest = "0.13.3"
serde_json = "1.0.149"
small-map = "0.1.5"
tokio = { version = "1.52.3", features = ["full"] }
url = "2.5.8"
wayland-client = "0.31.14"
zbus = "5.15.0"

[profile.release]
codegen-units = 1
lto = true

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[patch.crates-io]
softbuffer = { git = "https://github.com/rust-windowing/softbuffer", rev = "840683cfce68a04d20cfb75b2976d009d3ba77d8" }
